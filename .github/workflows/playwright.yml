name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/orderflow
          PORT: 3000
        run: |
          nohup npx ts-node src/server.ts > backend.log 2>&1 &
          disown

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev > frontend.log 2>&1 &
          disown

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Install Playwright test dependencies
        working-directory: playwright-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright-tests
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: playwright-tests
        run: npx playwright test

      - name: Show backend log on failure
        if: failure()
        run: cat backend/backend.log

      - name: Show frontend log on failure
        if: failure()
        run: cat frontend/frontend.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          retention-days: 7
